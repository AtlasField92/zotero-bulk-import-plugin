<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<!DOCTYPE window>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="bulk-import-dialog-window"
  onload="BulkImportDialog.onLoad()"
  onunload="BulkImportDialog.onUnload()"
  style="min-width: 640px; min-height: 580px; background-color: #f5f5f7; font-family: -apple-system, sans-serif;"
>
  <script src="chrome://bulk-import/content/bulkImportDialog.js" type="application/javascript"></script>

  <html:link rel="localization" href="bulkImport.ftl"/>

  <html:style>
    @import url("chrome://bulk-import/content/bulkImport.css");
    
    #bi-log-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      min-height: 200px;
      max-height: 300px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
  </html:style>

  <vbox flex="1" style="padding: 16px; gap: 12px; height: 100%; box-sizing: border-box; overflow: hidden;">

    <!-- ── TITLE ─────────────────────────────────────────────── -->
    <html:h2 id="bi-dialog-title" data-l10n-id="bulk-import-title" style="margin: 0 0 4px 0; font-size: 1.2em; color: #3a3a6e; flex-shrink: 0;"></html:h2>
    <separator style="border-bottom: 1px solid #ccc; margin-bottom: 4px; flex-shrink: 0;"/>

    <!-- ── COLLECTION ────────────────────────────────────────── -->
    <hbox align="center" style="gap: 8px; flex-shrink: 0;">
      <label control="bi-collection-select" data-l10n-id="bulk-import-collection-label" style="min-width: 160px; font-weight: bold;"></label>
      <menulist id="bi-collection-select" flex="1">
        <menupopup id="bi-collection-popup"></menupopup>
      </menulist>
    </hbox>

    <!-- ── FILE PICKER ────────────────────────────────────────── -->
    <hbox align="center" style="gap: 8px; flex-shrink: 0;">
      <label control="bi-file-path" data-l10n-id="bulk-import-file-label" style="min-width: 160px; font-weight: bold;"></label>
      <html:input
        id="bi-file-path"
        type="text"
        readonly="true"
        data-l10n-id="bulk-import-file-placeholder"
        flex="1"
        style="padding: 4px 6px; border-radius: 6px; border: 1px solid #c7c7cc; background: #fff;"
      />
      <html:button id="bi-browse-btn" data-l10n-id="bulk-import-browse" onclick="BulkImportDialog.browseFile()" style="border-radius: 6px; padding: 4px 12px;"></html:button>
    </hbox>

    <!-- ── DELAY ─────────────────────────────────────────────── -->
    <hbox align="center" style="gap: 8px; flex-shrink: 0;">
      <label control="bi-delay-input" data-l10n-id="bulk-import-delay-label" style="min-width: 160px; font-weight: bold;"></label>
      <html:input
        id="bi-delay-input"
        type="number"
        min="1"
        max="30"
        value="5"
        style="width: 70px; padding: 4px 6px; border-radius: 6px; border: 1px solid #c7c7cc; background: #fff;"
      />
    </hbox>

    <!-- ── PROGRESS BAR ───────────────────────────────────────── -->
    <hbox id="bi-progress-container" align="center" style="gap: 8px; margin-top: 4px; display: none; flex-shrink: 0;">
      <label id="bi-progress-label" data-l10n-id="bulk-import-progress-label" style="min-width: 160px;"></label>
      <html:progress id="bi-progress-bar" value="0" max="100" style="flex: 1; height: 10px;"></html:progress>
    </hbox>

    <!-- ── LOG ───────────────────────────────────────────────── -->
    <label data-l10n-id="bulk-import-log-title" style="font-weight: bold; margin-top: 4px; flex-shrink: 0;"></label>
    <html:div id="bi-log-container" style="flex: 1; min-height: 150px;">
    </html:div>

    <separator style="border-bottom: 1px solid #ccc; margin-top: 4px; flex-shrink: 0;"/>

    <!-- ── BUTTONS ───────────────────────────────────────────── -->
    <hbox align="center" style="gap: 8px; margin-top: 4px; flex-shrink: 0;">
      <html:button
        id="bi-donate-btn"
        data-l10n-id="bulk-import-donate"
        onclick="BulkImportDialog.openDonate()"
        style="cursor: pointer; border-radius: 6px; padding: 6px 14px; background: #ff2a2a; color: white !important; font-weight: bold; border: none;"
      >❤ Support me</html:button>
      <spacer flex="1"/>
      <html:button
        id="bi-start-btn"
        data-l10n-id="bulk-import-start"
        onclick="BulkImportDialog.startImport()"
        style="cursor: pointer; font-weight: bold; border-radius: 6px; padding: 6px 14px; background: #5e5ce6; color: white !important; border: none;"
      ></html:button>
      <html:button
        id="bi-close-btn"
        data-l10n-id="bulk-import-close"
        onclick="window.close()"
        style="cursor: pointer; border-radius: 6px; padding: 6px 14px; background: #e0e0e0; color: black !important; border: 1px solid #ccc;"
      ></html:button>
    </hbox>

  </vbox>
</window>
